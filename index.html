<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>札幌滑雪五日 每日行程</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 版面：頂部「每晚住哪」色帶 → 分頁列 → 左側日期欄＋右側當日時間軸。定山溪綠、札幌藍，橘色只留給要動手的地方（訂、勾、買）。 */
:root{
  color-scheme:light;
  --bg:#ECEFF4; --surface:#FFFFFF; --ink:#1B2333; --muted:#677284; --line:#DCE1E9;
  --jz:#2D6A57; --jz-soft:#E3F0EA; --spk:#3F72B2; --spk-soft:#E3ECF7;
  --accent:#2D6A57; --accent-ink:#FFFFFF; --ok:#2D7A52; --warn:#7A5410; --warn-soft:#F8EBC8;
  --shadow:none; --hero:#ECEFF4; --panel:#EDF0F4;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"JetBrains Mono","Noto Sans TC",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
a{color:var(--spk)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
.seg-jz{--c:var(--jz);--cs:var(--jz-soft)}
.seg-spk{--c:var(--spk);--cs:var(--spk-soft)}

/* 頂部 */
.hero{padding-top:22px;display:grid;gap:12px}
.eyebrow{font-size:12.5px;letter-spacing:.06em;color:var(--muted)}
.hero h1{font-size:30px;font-weight:700;letter-spacing:.02em}
.route{margin:0;color:var(--muted);font-size:14px}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{border:0;background:var(--cs,var(--surface));color:var(--c,var(--muted));border-top:4px solid var(--c,var(--line));border-radius:4px;
  padding:7px 8px 8px;text-align:left;font:inherit;cursor:pointer;min-width:0}
.cell b{display:block;font-family:var(--f-num);font-size:17px;line-height:1.2}
.cell span{display:block;font-size:11.5px;line-height:1.3;color:var(--ink)}
.cell.end{--c:var(--muted);--cs:var(--surface);border-top-style:dashed}
.cd{font-size:13px;color:var(--muted)}
.cd b{font-family:var(--f-num);font-size:15px;color:var(--ink)}

/* 分頁 */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:4px;overflow-x:auto;
  margin-top:14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
:is(button,a,label,input):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view{padding-top:18px}

/* 每日 */
.days{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.daynav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.dbtn{flex:0 0 auto;min-width:96px;text-align:left;border:1px solid var(--line);border-left:5px solid var(--c);background:var(--surface);color:var(--ink);
  font:inherit;border-radius:6px;padding:8px 12px;cursor:pointer}
.dbtn b{display:block;font-family:var(--f-num);font-size:15px}
.dbtn span{display:block;font-size:12.5px;color:var(--muted)}
.dbtn[aria-current="true"]{background:var(--c);border-color:var(--c);color:var(--bg)}
.dbtn[aria-current="true"] span{color:inherit;opacity:.92}
@media (min-width:880px){
  .days{grid-template-columns:210px minmax(0,1fr);gap:24px}
  .daynav{flex-direction:column;overflow:visible;position:sticky;top:64px;align-self:start}
  .dbtn{min-width:0}
}
.dayhead{background:var(--cs);border-radius:8px;padding:16px 18px;display:grid;gap:10px;border-top:5px solid var(--c)}
.dateline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bigdate{font-family:var(--f-num);font-size:42px;font-weight:700;line-height:1;color:var(--c)}
.wd{font-size:15px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface);color:var(--c);border:1px solid var(--c);font-weight:500}
.dayhead h2{font-size:20px}
.dayhead p{margin:0;color:var(--muted);font-size:14px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;border-radius:6px;padding:8px 14px;font-weight:700;font-size:14px;width:fit-content}
.sec{margin-top:22px}
.sec>h3{font-size:13px;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:10px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tm{font-family:var(--f-num);font-size:13px;color:var(--c);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.5;padding-top:1px}
.tl b{display:block;font-size:15.5px}
.tl p{margin:2px 0 0;color:var(--muted);font-size:14px}
.maplink{font-size:12.5px;margin-left:8px;white-space:nowrap}
.hls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.hl{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.hl .tag{font-size:12px;font-weight:700;color:var(--c)}
.hl b{display:block;margin:2px 0}
.hl p{margin:0;color:var(--muted);font-size:14px}
.tips{margin:0;padding-left:20px;display:grid;gap:6px}
.info{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 12px;margin:0;font-size:14px}
.info dt{color:var(--muted)}
.info dd{margin:0}

/* 表格與卡片 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card h3{font-size:16px;margin-bottom:6px}
.card p{margin:4px 0;color:var(--muted);font-size:14px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:700;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.note{background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:10px 14px;font-size:14px}
.h2{font-size:18px;margin:26px 0 10px}
.h2:first-child{margin-top:0}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--cs,var(--bg));color:var(--c,var(--muted));font-weight:700;border:1px solid var(--line)}
.leg{display:grid;gap:4px}
.leg .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.leg .rt{font-weight:700}

/* 預訂 */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.grp{margin:20px 0 8px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.bk{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.cbx{width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;background:var(--surface);cursor:pointer;padding:0;display:grid;place-items:center;color:var(--accent-ink);font-size:15px;line-height:1;margin-top:2px}
.cbx[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.cbx[aria-checked="true"]::after{content:"✓";font-weight:700}
.cbx:disabled{opacity:.45;cursor:not-allowed}
.bk.done .ttl{text-decoration:line-through;color:var(--muted)}
.ttl{font-weight:700;font-size:15px}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.meta b{color:var(--ink);font-weight:500}
.bk p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.files{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.file{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 8px;font-size:13px;background:var(--bg)}
.file a{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;color:var(--ink)}
.file button{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:12.5px;padding:2px 6px}
.file button.arm{color:#fff;background:#B3261E;border-radius:4px}
.up{border:1px dashed var(--muted);border-radius:6px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.empty{text-align:left;padding:22px;border:1px dashed var(--muted);border-radius:8px;background:var(--surface)}
.empty h3{font-size:17px;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:90vw}
/* 裝備 */
.kind{display:flex;gap:8px;margin-bottom:14px}
.kind button{flex:1;max-width:220px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;border-radius:6px;padding:10px 14px;cursor:pointer;text-align:left}
.kind button small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.kind button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.kind button[aria-pressed="true"] small{color:inherit;opacity:.85}
.bd{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.bd.rent{background:var(--jz-soft);color:var(--jz)}
.bd.own{background:var(--warn-soft);color:var(--warn)}
.bd.chk{background:var(--spk-soft);color:var(--spk)}
@media (max-width:480px){
  .tl li{grid-template-columns:70px minmax(0,1fr);gap:8px}
  .hero h1{font-size:26px}
  .bigdate{font-size:36px}
}
@media (prefers-reduced-motion:no-preference){ .dbtn,.tab{transition:background .15s,color .15s} }
/* 參考風格：藍灰底、白色大圓角卡片、深色膠囊分頁、等寬數字、襯線標題 */
body{background:var(--bg)}
.hero{padding:22px 0 0}
.hero h1{font-family:"Noto Serif TC",serif;font-weight:700;letter-spacing:0}
.cell{border:1px solid var(--line);border-radius:18px;padding:10px 12px 11px;box-shadow:none;background:var(--surface)}
.cell b{font-weight:700;color:var(--c,var(--muted))}
.cell::before{display:none}
.cell.end{border-style:dashed}
.tabs{border-bottom:1px solid var(--line);gap:6px;padding:10px 0 14px;margin-top:12px;background:var(--bg)}
.tab{border-radius:99px;padding:10px 20px;background:transparent;font-weight:500}
.tab{border-bottom:0;margin-bottom:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:700;border-bottom:0}
.dbtn{border:1px solid var(--line);border-radius:22px;box-shadow:none;padding:14px 18px;background:var(--surface);min-width:150px}
.dbtn::before{display:none}
.dbtn b{font-weight:500;font-size:13.5px;color:var(--muted)}
.dbtn span{font-size:16px;font-weight:700;color:var(--ink);margin-top:2px}
.dbtn[aria-current="true"]{background:var(--c);border-color:var(--c)}
.dbtn[aria-current="true"] b,.dbtn[aria-current="true"] span{color:#fff;opacity:1}
.dayhead{background:var(--surface);border:1px solid var(--line);border-top:1px solid var(--line);border-radius:28px;box-shadow:none;padding:24px 26px;gap:12px}
.dayhead h2{font-family:"Noto Serif TC",serif;font-size:28px;font-weight:700}
.bigdate{font-weight:700;font-size:38px}
.wd{font-family:var(--f-num);font-size:14px}
.chip{background:var(--panel);border:0;box-shadow:none;color:var(--c)}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:12px 22px;font-size:15px}
.card,.hl,.bk,.tw,.empty{border:1px solid var(--line);border-radius:22px;box-shadow:none}
.card,.hl{background:var(--surface)}
.card h3{font-family:"Noto Serif TC",serif}
.hl{border-radius:18px;background:var(--panel);border:0}
.sec>h3{letter-spacing:.04em;font-size:14px}
.tl li{border-top:1px dotted var(--line)}
.tl li:first-child{border-top:0}
.tm{font-weight:700;font-size:13px}
th{background:var(--panel);color:var(--muted)}
.tw{border-radius:20px}
.info dt{color:var(--muted)}
.note{border-radius:18px;background:var(--panel);color:var(--ink)}
.kind button{border-radius:99px;padding:10px 20px;border:1px solid var(--line);box-shadow:none}
.kind button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill,.bd{border-color:transparent}
.pill{background:var(--spk-soft);color:var(--spk)}
.cbx{border-radius:50%}
.bar{height:10px;background:var(--panel)}
.up,.file,.toast{border-radius:99px}
td.n,.cd b,.meta b{font-family:var(--f-num)}
@media (max-width:480px){.dayhead{padding:20px 18px}.dayhead h2{font-size:24px}.dbtn{min-width:140px}}
.tabs{display:none}
.daymap{height:300px;border:1px solid var(--line);border-radius:22px;margin-top:14px;overflow:hidden;background:var(--panel)}
.pin{width:26px;height:26px;border-radius:50%;background:var(--jz);color:#fff;font:700 13px var(--f-num);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.leaflet-container{font-family:var(--f-body)}
</style></head><body>

<div class="wrap">
  <header class="hero" id="hdr"></header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="行程分頁"></nav>
  <main id="view"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== 資料（改行程只改這一段） ===== */
const TRIP = {
  title: "札幌滑雪五日",
  route: "新千歲 → 札幌（1 晚）→ 小樽 → 定山溪溫泉飯店（3 晚）→ 新千歲，包車返程",
  START: "2027-04-03",
  people: "9–13 人"
};
const SEGMENTS = {
  jz:  { name: "定山溪", country: "日本", lat: 42.9697, lon: 141.1664 },
  spk: { name: "札幌",   country: "日本", lat: 43.0687, lon: 141.3508 }
};
const DAYS = [
  { seg:"spk", city:"新千歲機場 → 札幌市區", short:"抵達・札幌", theme:"落地進市區，晚上吃帝王蟹、逛薄野",
    plan:[
      {t:"15:10", title:"抵達新千歲機場（CTS）", desc:"入境審查、領行李。日本比台灣快 1 小時，這時台灣是 14:10。9–13 人出關通常要等齊，預留 60–90 分（估計）。", map:"新千歲機場"},
      {t:"約 16:40", title:"搭 JR 快速 Airport 到札幌", desc:"約 33–37 分，¥1,230，約 17:15 到札幌站（班次估計，近出發核對）。"},
      {t:"約 17:30", title:"入住札幌市區飯店、放行李", desc:"飯店還沒找，優先札幌站步行圈、可寄放行李、房數對得上。報到後輕裝出門。", map:"札幌駅"},
      {t:"19:00", title:"帝王蟹晚餐（待訂，10 人）", desc:"候選：札幌かに本家 札幌駅前本店（站步行約 5 分，11:30–22:00）、氷雪の門（薄野，11:00–23:00）。選單點或套餐，不選吃到飽；訂位時要求口味清淡。", map:"札幌かに本家 札幌駅前本店"},
      {t:"21:00 後", title:"薄野、狸小路自由逛", desc:"想早睡的人直接回飯店，明早還要去小樽。", map:"狸小路商店街"}
    ],
    hl:[
      {tag:"晚餐", title:"札幌蟹宴（10 人）", desc:"小樽市場店座位與進貨不穩，正式蟹宴放在抵達日的札幌。"},
      {tag:"抵達日", title:"長途後不排景點", desc:"體力留給 D2 的小樽與之後的滑雪。"}
    ],
    tips:["帝王蟹日文常寫タラバガニ（本タラバ），訂位時指定，並說明不要吃到飽。","團內有飲食限制者：訂位時用日文書面告知，現場再確認一次，也確認每桌套餐一致。","人數可能 9–13，蟹宴先訂 10 席，最後再依確定人數改。","明早要退房，今晚行李先整理成「去小樽」與「寄放」兩堆。"],
    stay:"札幌市區飯店（尚未找）第 1 晚", transport:"JR 快速 Airport（大眾交通）", temp:"札幌 4 月上旬約 0–9°C（估計）",
    route:["新千歲機場","札幌駅"], rmode:"transit",
    hops:[["台北","start"],["新千歲機場","flight"],["札幌","train"]] },

  { seg:"jz", city:"札幌 → 小樽 → 定山溪（溫泉飯店）", short:"小樽・入住溫泉飯店", theme:"吉伊卡哇、堺町、運河，傍晚回札幌取行李去定山溪",
    plan:[
      {t:"約 08:30", title:"退房，行李寄放在札幌飯店", desc:"退房後寄放行李，傍晚回來取，這樣小樽不用拖行李。要在 D1 入住時先問清楚可否寄放到傍晚。"},
      {t:"約 09:00", title:"搭 JR 札幌 → 小樽", desc:"快速 Airport 約 32–36 分，¥800，約每小時 3 班（估計）。", map:"小樽駅"},
      {t:"約 10:00", title:"ちいかわもぐもぐ本舗 小樽店", desc:"堺町 6-1，9:30–17:30，南小樽站步行約 8 分，約 60–90 分。4/4 是週日，人會多。入店方式出發前再核對：官方預約頁寫過 LINE 整理券（每人一張、不可用截圖），近期遊記寫現場排隊。", map:"ちいかわもぐもぐ本舗 小樽店"},
      {t:"11:30–13:30", title:"堺町通：北一硝子、音樂盒堂", desc:"2–3 小時。可拆成 2–3 個小組，訂固定集合時間。", map:"小樽 堺町通り"},
      {t:"午餐", title:"小樽市場周邊，分組自由吃", desc:"市場小店難一次坐 9–13 人，不訂團體午餐。備選：三角市場的味処たけだ、運河旁的澤崎水産。"},
      {t:"14:30", title:"小樽運河散步，遊船看班表", desc:"散步 45–60 分。遊船約 40 分、需提前 15 分報到，2027 年 4 月班表未公布。", map:"小樽運河"},

/* ===== 工具 ===== */
const WD = ["日","一","二","三","四","五","六"];
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function dayDate(i){ const p = TRIP.START.split("-").map(Number); return new Date(Date.UTC(p[0], p[1]-1, p[2]+i)); }
const md = dt => (dt.getUTCMonth()+1) + "/" + dt.getUTCDate();
const fmt = dt => md(dt) + "（" + WD[dt.getUTCDay()] + "）";
const _now = new Date();
const TODAY = Date.UTC(_now.getFullYear(), _now.getMonth(), _now.getDate());
const TODAY_STR = _now.getFullYear() + "/" + (_now.getMonth()+1) + "/" + _now.getDate();
function gmap(route, mode){
  if(!route || route.length < 2) return null;
  const q = encodeURIComponent;
  let u = "https://www.google.com/maps/dir/?api=1&origin=" + q(route[0]) + "&destination=" + q(route[route.length-1]) + "&travelmode=" + (mode || "driving");
  const w = route.slice(1, -1);
  if(w.length) u += "&waypoints=" + w.map(q).join("%7C");
  return u;
}
const gsearch = s => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s);
function opensDate(b){ if(!b.opens || b.opens.text) return null; return new Date(dayDate(b.day-1).getTime() - b.opens.before*86400000); }
function isOpen(b){
  if(!b.opens) return true;
  if(b.opens.text) return false;
  return opensDate(b).getTime() <= TODAY;
}

function bkRow(b){

    (canWrite() ? '<button data-delb="' + esc(b.id) + '" data-delf="' + esc(f.id) + '" class="' + (state.armed === b.id + '|' + f.id ? 'arm' : '') + '">' + (state.armed === b.id + '|' + f.id ? '再點一次刪除' : '刪除') + '</button>' : '') + '</span>').join("");
  const up = (state.assets && canWrite()) ? '<label class="up" for="f-' + esc(b.id) + '">' + (state.busy[b.id] ? '上傳中…' : '上傳票券') + '</label><input id="f-' + esc(b.id) + '" type="file" hidden data-upload="' + esc(b.id) + '" accept="image/*,application/pdf" multiple>' : '';
  return '<div class="bk' + (done ? ' done' : '') + '"><button class="cbx" role="checkbox" aria-checked="' + done + '" data-toggle="' + esc(b.id) + '" ' + (canWrite() ? '' : 'disabled') + ' aria-label="標記已完成：' + esc(b.item) + '"></button><div>' +
    '<div class="ttl">' + esc(b.item) + '</div><div class="meta"><b>' + dl + '</b> ・ ' + esc(b.status) + ' ・ 在哪訂：' + esc(b.where) + (opens ? ' ・ ' + esc(opens) : '') + (done && d.at ? ' ・ 已於 ' + esc(d.at) + ' 勾選' : '') + '</div>' +
    (b.note ? '<p>' + esc(b.note) + '</p>' : '') + ((fl || up) ? '<div class="files">' + fl + up + '</div>' : '') + '</div></div>';
}

let toastTimer;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4000); }

/* ===== 導覽 ===== */
const TABNAMES = TABS.map(t => t[0]);

function setTab(n){ if(location.hash === "#" + n){ state.tab = n; render(); window.scrollTo(0,0); } else { location.hash = n; } }
window.addEventListener("hashchange", () => { state.tab = tabFromHash(); render(); window.scrollTo(0,0); });
document.addEventListener("click", e => {

/* ===== 預訂清單（db） ===== */
function cloneDoc(id){ return JSON.parse(JSON.stringify(state.bk[id] || {done:false, at:null, files:[]})); }
function writeBk(id, fn){
  const prev = queue[id] || Promise.resolve();
  const p = prev.then(async () => {
    const next = fn(cloneDoc(id));
    if(!next.files) next.files = [];
    await state.db.doc("bookings/" + id).set(next);
  });
  queue[id] = p.catch(() => {});
  return p;
}
function onWriteError(e){
  if(e && e.code === "invalid_argument"){ state.denied = true; toast("目前的身分只能查看，不能勾選或上傳"); render(); }
  else toast("儲存失敗，請稍後再試");
}
async function toggleBk(id){
  try{ await writeBk(id, d => { d.done = !d.done; d.at = d.done ? TODAY_STR : null; return d; }); }
  catch(e){ onWriteError(e); }
}
async function toJpeg(file){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("convert")), "image/jpeg", 0.85));
}
async function uploadFiles(id, files){
  if(!state.assets) return;
  state.busy[id] = true; render();
  const OK = ["image/jpeg","image/png","image/webp","image/gif","application/pdf"];
  try{
    for(const f of files){
      let blob = f, type = f.type, name = f.name;
      const heic = /heic|heif/i.test(type) || /\.(heic|heif)$/i.test(name);
      const img = type.indexOf("image/") === 0 || heic;
      if(img && (heic || f.size > 8 * 1024 * 1024)){
        try{ blob = await toJpeg(f); type = "image/jpeg"; name = name.replace(/\.[^.]+$/, "") + ".jpg"; }
        catch(e){ toast("這張照片無法轉成 JPEG，請改傳截圖或 PDF：" + name); continue; }
      }
      if(OK.indexOf(type) < 0){ toast("不支援的檔案類型：" + name); continue; }
      const r = await state.assets.upload(blob, {type: type});
      await writeBk(id, d => {
        d.files = (d.files || []).concat([{id: r.id, name: name, type: type, size: r.sizeBytes}]);
        if(!d.done){ d.done = true; d.at = TODAY_STR; }
        return d;
      });
    }
  }catch(e){
    if(e && e.code === "too_large") toast("檔案太大，請縮小後再傳");
    else if(e && e.code === "quota_or_state") toast("儲存空間已滿");
    else onWriteError(e);
  }
  state.busy[id] = false; render();
}
async function delFile(bid, fid){
  const key = bid + "|" + fid;
  if(state.armed !== key){ state.armed = key; render(); setTimeout(() => { if(state.armed === key){ state.armed = ""; render(); } }, 4000); return; }
  state.armed = "";
  try{
    await state.assets.delete(fid);
    await writeBk(bid, d => { d.files = (d.files || []).filter(f => f.id !== fid); return d; });
  }catch(e){ onWriteError(e); }
  render();
}
function startSnap(){
  let timer = setTimeout(() => { if(state.dbStatus === "loading"){ state.dbStatus = "slow"; if(state.tab === "bookings") render(); } }, 10000);
  state.db.collection("bookings").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); });
    state.bk = m;
    if(!snap.metadata.fromCache){ state.dbStatus = "ready"; clearTimeout(timer); }
    if(state.tab === "bookings") render();
  }, err => {
    clearTimeout(timer); state.dbStatus = "error"; if(state.tab === "bookings") render();
  });
}

  [["jz","bus"],["ski",""]],

  [["jz","car"],["cts",""]]

let _map = null;
function drawMaps(){
  const el = document.getElementById("daymap"); if(!el) return;
  if(_map){ try{ _map.remove(); }catch(e){} _map = null; }
  if(typeof L === "undefined"){ el.style.display = "none"; return; }
  const pts = DAYPTS[state.day] || [];
  const ll = pts.map(p => [COORDS[p[0]][1], COORDS[p[0]][2]]);
  _map = L.map(el, {scrollWheelZoom:false});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:18, attribution:"© OpenStreetMap"}).addTo(_map);
  const color = getComputedStyle(document.documentElement).getPropertyValue("--jz").trim() || "#2D6A57";
  for(let i = 0; i < pts.length - 1; i++){
    const kind = pts[i][1];
    const o = {color:color, weight:kind === "train" ? 5 : 3, opacity:.85};
    if(kind !== "train") o.dashArray = kind === "walk" ? "2 6" : "8 8";
    L.polyline([ll[i], ll[i+1]], o).addTo(_map);
  }
  pts.forEach((p, i) => {
    const ic = L.divIcon({className:"", html:'<div class="pin">' + (i+1) + '</div>', iconSize:[26,26], iconAnchor:[13,13]});
    L.marker(ll[i], {icon:ic}).addTo(_map).bindTooltip(COORDS[p[0]][0]);
  });
  _map.fitBounds(L.latLngBounds(ll), {padding:[30,30]});
  document.getElementById("mapnote").textContent = pts.map((p, i) => (i+1) + " " + COORDS[p[0]][0]).join(" → ") + "。座標為站點或街區位置，不是住處。實線為火車，虛線為巴士、地鐵或步行。";
}

    } else state.dbStatus = "none";
  }catch(e){ state.dbStatus = "none"; }

})();
